name: image

# Builds the Wingman Computer for linux/arm64 and linux/amd64 on native runners, boots each one and
# checks /health, then joins them into one multi-arch image on GHCR, attests its provenance and pins
# the new digest in image.lock.
on:
  push:
    branches: [main]
    paths-ignore: ["image.lock", "**.md", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/airaptr/wingman-computer

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    outputs:
      digest-amd64: ${{ steps.out.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.out.outputs.digest-arm64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false
      - id: out
        run: echo "digest-${{ matrix.arch }}=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
      - name: Smoke test, boot the image and ask /health
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$REF"
          docker run -d --name box --shm-size 1g -e WINGMAN_BIND=0.0.0.0 -p 127.0.0.1:1337:1337 "$REF"
          code=000
          for i in $(seq 90); do
            code=$(docker exec box sh -c 'curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $(cat /etc/wingman/token)" http://127.0.0.1:1337/health' || true)
            [ "$code" = 200 ] && break
            sleep 2
          done
          echo "health after ${i} tries: $code"
          # The token never leaves the box: the check runs inside it, and only the report is printed.
          docker exec box sh -c 'curl -s -H "Authorization: Bearer $(cat /etc/wingman/token)" http://127.0.0.1:1337/health' | tee health.json
          echo
          noauth=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:1337/health)
          echo "health without a token from the runner: $noauth"
          test "$noauth" = 401
          python3 -c 'import json,sys; h=json.load(open("health.json")); assert h["ok"], h; assert h["screen"]=="1920x1200", h["screen"]'
          docker exec box sh -c 'node --version; uv --version; gh --version | head -1; chromium --version; python3 --version; date +%Z'
      - if: failure()
        run: docker exec box sh -c 'tail -n 40 /var/log/wingman/*.log' || true

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: merge
        env:
          A: ${{ needs.build.outputs.digest-amd64 }}
          B: ${{ needs.build.outputs.digest-arm64 }}
        run: |
          set -euo pipefail
          day=$(TZ=America/Los_Angeles date +%Y.%m.%d)
          docker buildx imagetools create -t "$IMAGE:$day" -t "$IMAGE:latest" "$IMAGE@$A" "$IMAGE@$B"
          digest=$(docker buildx imagetools inspect "$IMAGE:$day" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "tag=$day" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$IMAGE@$digest"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true
      - name: Pin the new digest in image.lock
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
          TAG: ${{ steps.merge.outputs.tag }}
        run: |
          set -euo pipefail
          cat > image.lock <<EOF
          # The Wingman Computer image this repo pins. box.sh pull and start use this digest, never a moving tag.
          image=$IMAGE
          digest=$DIGEST
          tag=$TAG
          source_commit=$GITHUB_SHA
          built=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          workflow_run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          sed -i 's/^          //' image.lock
          cat image.lock
          echo "### $IMAGE@$DIGEST (tag $TAG)" >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add image.lock
          git commit -m "Pin image $TAG: box.sh pull now fetches $DIGEST" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
