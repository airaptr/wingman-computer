name: image

on:
  push:
    branches: [main]
    paths-ignore: [image.lock, "**.md", LICENSE, NOTICE]
  pull_request:
    paths-ignore: ["**.md", LICENSE, NOTICE]
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/airaptr/wingman-computer

jobs:
  build:
    name: Boot gate (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Keep the registry account out of logs
        run: echo "::add-mask::$GITHUB_ACTOR"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install the OCI archive transport
        run: |
          if ! command -v skopeo >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends skopeo
          fi
      - name: Build once, without registry access
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          provenance: false
          sbom: false
          labels: org.opencontainers.image.revision=${{ github.sha }}
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=desktop-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=desktop-${{ matrix.arch }}
      - name: Load the exact archive and enforce the size budget
        env:
          ARCHIVE: ${{ runner.temp }}/image.tar
        run: |
          set -euo pipefail
          skopeo inspect --raw "oci-archive:$ARCHIVE" | jq -e '([.layers[].size] | add) < 1610612736'
          skopeo inspect --format '{{.Digest}}' "oci-archive:$ARCHIVE" > "$RUNNER_TEMP/digest.txt"
          skopeo copy "oci-archive:$ARCHIVE" docker-daemon:wingman-computer:dev
      - name: Check image hygiene, desktop, browser, authentication and PTY
        env:
          WINGMAN_RUNTIME: docker
          WINGMAN_COMPUTER_IMAGE: wingman-computer:dev
        run: bash tools/ci-check.sh
      - name: Retain only the tested OCI bytes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/image.tar
            ${{ runner.temp }}/digest.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish only after both native boot gates
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
      tag: ${{ steps.index.outputs.tag }}
    steps:
      - name: Keep the registry account out of logs
        run: echo "::add-mask::$GITHUB_ACTOR"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: images
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested archives by digest, without rebuilding
        run: |
          set -euo pipefail
          if ! command -v skopeo >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends skopeo
          fi
          for arch in amd64 arm64; do
            archive="images/desktop-$arch/image.tar"
            expected=$(cat "images/desktop-$arch/digest.txt")
            actual=$(skopeo inspect --format '{{.Digest}}' "oci-archive:$archive")
            test "$actual" = "$expected"
            skopeo copy --preserve-digests --authfile "$HOME/.docker/config.json" \
              "oci-archive:$archive" "docker://$IMAGE@$expected"
          done
      - name: Join both architectures into the release index
        id: index
        run: |
          set -euo pipefail
          amd64=$(cat images/desktop-amd64/digest.txt)
          arm64=$(cat images/desktop-arm64/digest.txt)
          tag=$(date -u +%Y.%m.%d)
          docker buildx imagetools create -t "$IMAGE:$tag" -t "$IMAGE:latest" \
            "$IMAGE@$amd64" "$IMAGE@$arm64"
          digest=$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Manifest}}' | jq -r .digest)
          docker buildx imagetools inspect --raw "$IMAGE@$digest" | \
            jq -e '[.manifests[].platform.architecture] | sort == ["amd64","arm64"]'
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Attest the multi-architecture index
        id: attest
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Wait before retrying a failed signing-service request
        if: steps.attest.outcome == 'failure'
        run: sleep 15
      - name: Retry provenance publication; a second failure stops the release
        if: steps.attest.outcome == 'failure'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Verify the registry bundle and exact build source
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          gh attestation verify "oci://$IMAGE@$DIGEST" \
            --bundle-from-oci \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/image.yml" \
            --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF"
      - name: Verify the package link and report its visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          package=$(gh api "/orgs/$GITHUB_REPOSITORY_OWNER/packages/container/wingman-computer")
          test "$(printf '%s' "$package" | jq -r .repository.full_name)" = "$GITHUB_REPOSITORY"
          visibility=$(printf '%s' "$package" | jq -r .visibility)
          echo "Package visibility: $visibility"
          if [ "$visibility" != public ]; then
            echo "::warning title=Anonymous downloads blocked::Enable Public under Danger Zone > Change visibility at https://github.com/orgs/$GITHUB_REPOSITORY_OWNER/packages/container/package/wingman-computer/settings"
          fi

  lock:
    name: Propose the verified image lock
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Keep the registry account out of logs
        run: echo "::add-mask::$GITHUB_ACTOR"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Write the proposed lock
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          set -euo pipefail
          {
            echo '# Merging this reviewed lock selects the image new computers will boot.'
            echo "image=$IMAGE"
            echo "digest=$DIGEST"
            echo "tag=$TAG"
            echo "source_commit=$GITHUB_SHA"
            echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "workflow_run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > image.lock
      - name: Open a bot PR; never write directly to main
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          author: Wildhaven <1735900+kody-w@users.noreply.github.com>
          committer: Wildhaven <1735900+kody-w@users.noreply.github.com>
          branch: bot/image-lock
          add-paths: image.lock
          commit-message: "Boot the verified computer image ${{ needs.publish.outputs.tag }}"
          title: "Boot the verified computer image ${{ needs.publish.outputs.tag }}"
          body: |
            Both native architectures passed the image and desktop boot gates before any registry push.
            The published multi-architecture index has a GitHub build-provenance attestation.
            Review and merge this PR to select the digest; no moving tag is used by box.sh.
          delete-branch: true
      - name: Run read-only boot checks for the bot PR
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run image.yml --repo "$GITHUB_REPOSITORY" --ref bot/image-lock
